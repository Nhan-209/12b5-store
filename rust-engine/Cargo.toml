[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"
authors = ["ElectroStore Team <dev@electro.vn>"]
description = "High-performance microservice engine for Electronics E-Commerce website"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
